[package]
name = "zerogravity"
version = "1.0.0"
description = "0G — Intelligent Collaborative Workspace"
authors = ["Jyo"]
edition = "2021"

[lib]
name = "zerogravity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encryption (RustCrypto — chacha20poly1305)
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"

# HTTP client for model APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# File system utilities
walkdir = "2"
sha2 = "0.10"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

# Knowledge graph engine
petgraph = { version = "0.6", features = ["serde-1"] }

# Regex-based code parsing
regex = "1"

# Integrated terminal — real PTY (pseudo-terminal), not a fake shell wrapper.
portable-pty = "0.8"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
